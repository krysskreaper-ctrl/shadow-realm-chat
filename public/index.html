<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00ff00">
    
    <title>☣️ Shadow Realm</title> 
    
    <!-- External Dependencies for Fonts and Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <!-- Application Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <!-- Outer Visual Layers for Theme -->
    <div class="outer-border-intricate"></div>
    <div class="outer-border-blood"></div>

    <header>
        <h1>
            Shadow Realm
        </h1>
        
        <div id="user-status-container">
            <span id="user-count">0 users online</span>
        </div>
    </header>

    
    <section id="join-screen" class="screen active">
        <h2>Enter the Shadow Realm...</h2>
        <input id="username-input" type="text" placeholder="Enter your username" maxlength="20">
        <button id="join-button" class="button-base">Join Chat</button>
    </section>

    
    <section id="chat-screen" class="screen">
        <div id="user-list-container" style="background: #111; padding: 10px; margin-bottom: 10px; border-radius: 6px;">
            <h3 style="margin: 0 0 5px 0; color: #00ff00; font-size: 1rem;">Online Users</h3>
            <ul id="user-list" style="list-style: none; padding: 0; margin: 0; color: #aaa;"></ul>
        </div>
        <main>
            <div id="messages" class="messages">
                <!-- Messages will be injected here by JavaScript -->
            </div>
            <div id="typing-indicator" class="typing-indicator" style="height: 20px; color: #00ff00; font-style: italic; padding: 5px;"></div>

            <div class="input-container">
                <input id="message-input" type="text" placeholder="Type a message..." maxlength="500" disabled>
                <button id="send-button" class="button-base" disabled>Send</button>
            </div>
        </main>
    </section>
    
    
    <!-- Socket.io Client Library -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- Application JavaScript -->
    <script src="app.js"></script>
</body>
</html>
