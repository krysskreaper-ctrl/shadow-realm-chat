<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff00">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Realm Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👻 Shadow Realm Chat</h1>
            <div class="user-count">
                <span id="user-count">0 users online</span>
            </div>
        </header>

        <div id="join-screen" class="screen active">
            <div class="join-box">
                <h2>Enter the Shadow Realm</h2>
                <input type="text" id="username-input" placeholder="Enter your username..." maxlength="20" autocomplete="off">
                <button id="join-button">Join Chat</button>
            </div>
        </div>

        <div id="chat-screen" class="screen">
            <div class="chat-container">
                <aside class="sidebar">
                    <h3>Users Online</h3>
                    <ul id="user-list"></ul>
                </aside>

                <main class="chat-main">
                    <div id="messages" class="messages"></div>
                    
                    <div id="typing-indicator" class="typing-indicator"></div>

                    <div class="input-container">
                        <input type="text" id="message-input" placeholder="Type a message..." maxlength="500" autocomplete="off" disabled>
                        <button id="send-button" disabled>Send</button>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
